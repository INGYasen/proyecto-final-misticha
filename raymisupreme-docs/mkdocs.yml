site_name: Documentación Técnica - Raymi Suprême
site_description: Documentación técnica, operativa y funcional del sistema e-commerce distribuido Raymi Suprême
site_author: Equipo Raymi Suprême

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Inicio: index.md

  - Visión del Producto:
      - Resumen Ejecutivo: producto/resumen-ejecutivo.md
      - Problema de Negocio: producto/problema-negocio.md
      - Propuesta de Solución: producto/propuesta-solucion.md
      - Alcance del Sistema: producto/alcance.md
      - Objetivos del Proyecto: producto/objetivos.md
      - Actores del Sistema: producto/actores.md

  - Arquitectura del Sistema:
      - Arquitectura General: arquitectura/arquitectura-general.md
      - Diagrama de Microservicios: arquitectura/diagrama-microservicios.md
      - Flujo End-to-End de Compra: arquitectura/flujo-compra.md
      - Comunicación entre Microservicios: arquitectura/comunicacion-microservicios.md
      - Patrones Aplicados: arquitectura/patrones-aplicados.md
      - Decisiones Técnicas: arquitectura/decisiones-tecnicas.md

  - Microservicios:
      - Descripción General: microservicios/descripcion-general.md
      - API Gateway: microservicios/api-gateway.md
      - Eureka Server: microservicios/eureka-server.md
      - ms-auth: microservicios/ms-auth.md
      - ms-acopio: microservicios/ms-acopio.md
      - ms-inventario: microservicios/ms-inventario.md
      - ms-catalogo: microservicios/ms-catalogo.md
      - ms-carrito: microservicios/ms-carrito.md
      - ms-ventas: microservicios/ms-ventas.md
      - ms-pagos: microservicios/ms-pagos.md

  - Base de Datos:
      - Modelo de Datos General: base-datos/modelo-general.md
      - Base de Datos por Microservicio: base-datos/base-datos-microservicio.md
      - Tablas Principales: base-datos/tablas-principales.md
      - Relaciones y Responsabilidades: base-datos/relaciones-responsabilidades.md
      - Datos de Prueba: base-datos/datos-prueba.md

  - Seguridad:
      - Modelo de Seguridad: seguridad/modelo-seguridad.md
      - Autenticación con Keycloak: seguridad/keycloak.md
      - Autorización por Roles: seguridad/roles-permisos.md
