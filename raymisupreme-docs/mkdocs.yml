      - Endpoints de Acopio: apis/ms-acopio.md
      - Endpoints de Inventario: apis/ms-inventario.md
      - Endpoints de Catálogo: apis/ms-catalogo.md
      - Endpoints de Carrito: apis/ms-carrito.md
      - Endpoints de Ventas: apis/ms-ventas.md
      - Endpoints de Pagos: apis/ms-pagos.md
      - Colección Postman: apis/postman.md

  - Manual de Instalación:
      - Requisitos Previos: instalacion/requisitos-previos.md
      - Variables de Entorno: instalacion/variables-entorno.md
      - Configuración Local: instalacion/configuracion-local.md
