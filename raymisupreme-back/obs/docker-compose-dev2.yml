name: raymisupreme-obs-dev

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: raymisupreme-prometheus
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - raymisupreme_prometheus_data:/prometheus
    networks:
      - ms-net

  loki:
    image: grafana/loki:3.4.1
    container_name: raymisupreme-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yaml:ro
      - raymisupreme_loki_data:/loki
    networks:
      - ms-net

  promtail:
    image: grafana/promtail:3.4.1
    container_name: raymisupreme-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    networks:
      - ms-net

  grafana:
    image: grafana/grafana:11.6.0
    container_name: raymisupreme-grafana
    restart: unless-stopped
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - raymisupreme_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - ms-net

volumes:
  raymisupreme_prometheus_data:
  raymisupreme_loki_data:
  raymisupreme_grafana_data:

networks:
  ms-net:
    external: true
    name: ms-net