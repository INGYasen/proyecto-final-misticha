name: raymisupreme-obs-dev

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: raymisupreme-prometheus-dev
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - raymisupreme_prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ms-net

  loki:
    image: grafana/loki:3.4.1
    container_name: raymisupreme-loki-dev
    restart: unless-stopped
    ports:
      - "13100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yaml:ro
      - raymisupreme_loki_data:/loki
    networks:
      - ms-net

  promtail:
    image: grafana/promtail:3.4.1
    container_name: raymisupreme-promtail-dev
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - ../infra/gateway/logs:/var/log/ms/gateway:ro
      - ../services/ms-acopio/logs:/var/log/ms/ms-acopio:ro
      - ../services/ms-auth/logs:/var/log/ms/ms-auth:ro
      - ../services/ms-carrito/logs:/var/log/ms/ms-carrito:ro
      - ../services/ms-catalogo/logs:/var/log/ms/ms-catalogo:ro
      - ../services/ms-inventario/logs:/var/log/ms/ms-inventario:ro
      - ../services/ms-pagos/logs:/var/log/ms/ms-pagos:ro
      - ../services/ms-ventas/logs:/var/log/ms/ms-ventas:ro
    depends_on:
      - loki
    networks:
      - ms-net

  kafka:
    image: apache/kafka:3.8.1
    container_name: raymisupreme-kafka-dev
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: raymisupreme-kafka-0001
    networks:
      - ms-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: raymisupreme-kafka-ui-dev
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: raymisupreme
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka
    networks:
      - ms-net

  grafana:
    image: grafana/grafana:11.6.0
    container_name: raymisupreme-grafana-dev
    restart: unless-stopped
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - raymisupreme_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - ms-net

volumes:
  raymisupreme_prometheus_data:
  raymisupreme_loki_data:
  raymisupreme_grafana_data:

networks:
  ms-net:
    name: ms-net
    external: true
