spring:
  application:
    name: registry-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # En local, una copia vieja no debe seguir figurando UP.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: "*"
