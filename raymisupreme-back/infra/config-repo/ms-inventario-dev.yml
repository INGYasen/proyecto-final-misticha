server:
  port: 8087

spring:
  servlet:
    multipart:
      # La interfaz permite imagenes de hasta 10 MB. Se deja margen para
      # que el contenedor acepte el cuerpo multipart completo.
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:mysql://localhost:3317/db_inventario?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ── JWT: valida contra keycloak-dev (docker-compose-dev.yml → localhost:9091) ──
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9091/realms/raymisupreme-dev


eureka:
  client:
    service-url:
      defaultZone: http://localhost:7081/eureka
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.raymisupreme.msinventario: DEBUG

app:
  upload:
    dir: ${RAYMI SUPRÊME_IMAGES_DIR:../../images/prendas}
  base-url: http://localhost:7091

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      ms-acopio:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
