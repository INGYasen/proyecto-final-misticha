server:
  port: 8186
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://${ACOPIO_DB_HOST}:${ACOPIO_DB_PORT}/${ACOPIO_DB_NAME}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: ${ACOPIO_DB_USERNAME}
    password: ${ACOPIO_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ── Keycloak JWT validation ────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # ── issuer-uri: ${KEYCLOAK_URL:http://keycloak:8080}/realms/raymisupreme
          issuer-uri: ${KEYCLOAK_URL:http://keycloak:8080}/realms/raymisupreme-prod


eureka:
  client:
    service-url:
      defaultZone: http://registry-server-prod:7081/eureka
    enabled: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true