name: ms-carrito-prod

services:
  mysql-carrito:
    image: mysql:8.0
    container_name: mysql-carrito
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${CARRITO_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${CARRITO_MYSQL_DATABASE}
    ports:
      - "3312:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${CARRITO_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_carrito_data:/var/lib/mysql
    networks:
      - carrito-int

  ms-carrito:
    build: .
    container_name: ms-carrito
    restart: unless-stopped
    depends_on:
      mysql-carrito:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      CARRITO_DB_HOST: mysql-carrito
      CARRITO_DB_PORT: 3306
      CARRITO_DB_NAME: ${CARRITO_MYSQL_DATABASE}
      CARRITO_DB_USERNAME: root
      CARRITO_DB_PASSWORD: ${CARRITO_MYSQL_ROOT_PASSWORD}
    ports:
      - "8192:8192"
    networks:
      - carrito-int
      - ms-net

volumes:
  mysql_carrito_data:

networks:
  ms-net:
    external: true
    name: ms-net
  carrito-int:
    name: carrito-int
