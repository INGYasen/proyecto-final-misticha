name: ms-inventario-prod

services:
  mysql-inventario:
    image: mysql:8.0
    container_name: mysql-inventario
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${INVENTARIO_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${INVENTARIO_MYSQL_DATABASE}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${INVENTARIO_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_inventario_data:/var/lib/mysql
    networks:
      - inventario-int

  ms-inventario:
    build: .
    container_name: ms-inventario
    restart: unless-stopped
    depends_on:
      mysql-inventario:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      INVENTARIO_DB_HOST: mysql-inventario
      INVENTARIO_DB_PORT: 3306
      INVENTARIO_DB_NAME: ${INVENTARIO_MYSQL_DATABASE}
      INVENTARIO_DB_USERNAME: root
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_MYSQL_ROOT_PASSWORD}
    ports:
      - "8187:8187"
    networks:
      - inventario-int
      - ms-net

volumes:
  mysql_inventario_data:

networks:
  ms-net:
    external: true
    name: ms-net
  inventario-int:
    name: inventario-int
