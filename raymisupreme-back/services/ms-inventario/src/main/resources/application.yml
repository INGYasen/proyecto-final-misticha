spring:
  application:
    name: ms-inventario
  profiles:
    active: dev
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:7071}"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  error:
    include-message: always

app:
  upload:
    dir: ${RAYMI SUPRÊME_IMAGES_DIR:../../images/prendas}
  base-url: http://localhost:7091

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO

internal:
  payment-secret: ${INTERNAL_PAYMENT_SECRET:raymisupreme-local-payment-secret}

resilience4j:
  circuitbreaker:
    instances:
      ms-acopio:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
