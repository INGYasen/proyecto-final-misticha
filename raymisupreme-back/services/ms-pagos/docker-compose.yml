name: ms-pagos-prod

services:
  mysql-pagos:
    image: mysql:8.0
    container_name: mysql-pagos
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${PAGOS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PAGOS_MYSQL_DATABASE}
    ports:
      - "3311:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${PAGOS_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_pagos_data:/var/lib/mysql
    networks:
      - pagos-int

  ms-pagos:
    build: .
    container_name: ms-pagos
    restart: unless-stopped
    depends_on:
      mysql-pagos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      PAGOS_DB_HOST: mysql-pagos
      PAGOS_DB_PORT: 3306
      PAGOS_DB_NAME: ${PAGOS_MYSQL_DATABASE}
      PAGOS_DB_USERNAME: root
      PAGOS_DB_PASSWORD: ${PAGOS_MYSQL_ROOT_PASSWORD}
    ports:
      - "8192:8192"
    networks:
      - pagos-int
      - ms-net

volumes:
  mysql_pagos_data:

networks:
  ms-net:
    external: true
    name: ms-net
  pagos-int:
    name: pagos-int
