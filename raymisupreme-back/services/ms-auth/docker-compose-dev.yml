name: ms-auth-dev

services:
  # Keycloak es el "backend" de ms-usuarios, igual que MySQL lo es para los otros servicios.
  # La app (ms-usuarios) corre desde IntelliJ con perfil "dev".
  keycloak-dev:
    image: quay.io/keycloak/keycloak:25.0.2
    container_name: keycloak-dev
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "9091:8080"    # 9091 en host → no choca con el keycloak de prod (9090)
    volumes:
      - keycloak_auth_dev:/opt/keycloak/data

volumes:
  keycloak_auth_dev: