name: ms-catalogo-prod

services:
  mysql-catalogo:
    image: mysql:8.0
    container_name: mysql-catalogo
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${CATALOGO_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${CATALOGO_MYSQL_DATABASE}
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${CATALOGO_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_catalogo_data:/var/lib/mysql
    networks:
      - catalogo-int

  ms-catalogo:
    build: .
    container_name: ms-catalogo
    restart: unless-stopped
    depends_on:
      mysql-catalogo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      CATALOGO_DB_HOST: mysql-catalogo
      CATALOGO_DB_PORT: 3306
      CATALOGO_DB_NAME: ${CATALOGO_MYSQL_DATABASE}
      CATALOGO_DB_USERNAME: root
      CATALOGO_DB_PASSWORD: ${CATALOGO_MYSQL_ROOT_PASSWORD}
    ports:
      - "8189:8189"
    networks:
      - catalogo-int
      - ms-net

volumes:
  mysql_catalogo_data:

networks:
  ms-net:
    external: true
    name: ms-net
  catalogo-int:
    name: catalogo-int
