<!-- MAIN NAV -->
<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="container navbar-inner">
    <a routerLink="/" class="navbar-logo" aria-label="Raymi Suprême">
      <img src="assets/logo-nav.png?v=rs" alt="Raymi Suprême" class="logo-image">
    </a>

    <ul class="nav-links">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Inicio</a></li>
      <li><a routerLink="/catalogo" routerLinkActive="active">Catálogo</a></li>
      <li><a routerLink="/" fragment="nosotros">Nosotros</a></li>
      <li><a routerLink="/contacto" routerLinkActive="active">Contacto</a></li>
    </ul>

    <form class="nav-search" (ngSubmit)="search()" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>
      <input
        type="search"
        name="searchTerm"
        [(ngModel)]="searchTerm"
        placeholder="Buscar"
        aria-label="Buscar productos">
    </form>

    <div class="nav-actions">
      <div class="nav-session" *ngIf="isLoggedIn">
        <span class="nav-user">Hola, {{ user?.given_name || user?.preferred_username || 'Cliente' }}</span>
        <a *ngIf="panelLink" [routerLink]="panelLink">{{ panelLabel }}</a>
        <a routerLink="/mis-pedidos">Mis pedidos</a>
        <a (click)="logout()" class="logout-link">Salir</a>
      </div>
      <button class="nav-icon-btn desktop-action" type="button" [class.is-on]="favOpen" (click)="openFavorites()" aria-label="Favoritos" title="Favoritos">
        <svg viewBox="0 0 24 24" [attr.fill]="favCount ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.8">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path>
        </svg>
        <span class="cart-badge" *ngIf="favCount > 0">{{ favCount }}</span>
      </button>

      <button class="nav-icon-btn desktop-action" type="button" [class.is-on]="profileOpen" (click)="openProfile()" aria-label="Mi perfil" title="Mi perfil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21a8 8 0 0 1 16 0"></path>
        </svg>
      </button>

      <button class="nav-icon-btn" type="button" (click)="openCart()" aria-label="Carrito" title="Carrito">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <path d="M3 6h18M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </button>

      <button class="hamburger" type="button" [class.active]="isMobileMenuOpen" (click)="toggleMobileMenu()" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="mobile-search-wrap">
    <form class="nav-search mobile-search" (ngSubmit)="search()" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
      </svg>
      <input type="search" name="mobileSearchTerm" [(ngModel)]="searchTerm" placeholder="Buscar productos" aria-label="Buscar productos">
    </form>
  </div>

  <div class="mobile-menu" [class.open]="isMobileMenuOpen">
    <ul>
      <li><a routerLink="/" (click)="toggleMobileMenu()">Inicio</a></li>
      <li><a routerLink="/catalogo" (click)="toggleMobileMenu()">Catálogo</a></li>
      <li><a routerLink="/contacto" (click)="toggleMobileMenu()">Contacto</a></li>
      <li><a (click)="openFavorites(); toggleMobileMenu()">Favoritos</a></li>
      <li><a (click)="openProfile(); toggleMobileMenu()">Mi perfil</a></li>
      <li *ngIf="!isLoggedIn"><a routerLink="/registro" (click)="entrarSinPagar(); toggleMobileMenu()">Registrarse</a></li>
      <li *ngIf="isLoggedIn"><a (click)="logout()">Cerrar sesión</a></li>
    </ul>
  </div>
</nav>
