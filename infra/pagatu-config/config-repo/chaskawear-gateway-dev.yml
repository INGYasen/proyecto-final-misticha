server:
  port: 17080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: chaskawear-catalogo-categorias
              uri: lb://chaskawear-catalogo-ms
              predicates:
                - Path=/api/v1/categorias/**
            - id: chaskawear-catalogo-productos
              uri: lb://chaskawear-catalogo-ms
              predicates:
                - Path=/api/v1/productos/**
            - id: chaskawear-orden-ordenes
              uri: lb://chaskawear-orden-ms
              predicates:
                - Path=/api/v1/ordenes/**
            - id: chaskawear-orden-detalles
              uri: lb://chaskawear-orden-ms
              predicates:
                - Path=/api/v1/orden-detalles/**

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:17761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
